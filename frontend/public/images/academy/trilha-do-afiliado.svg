<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-label="Mockup de uma rede de afiliados: ligações partilhadas entre pessoas e comissões">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D2537"/>
      <stop offset="1" stop-color="#0D1320"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBB03B"/>
      <stop offset="1" stop-color="#F0801F"/>
    </linearGradient>
    <linearGradient id="glassTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#EEF2F7" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBB03B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FBB03B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftCalm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1320" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#0D1320" stop-opacity="0.35"/>
      <stop offset="0.62" stop-color="#0D1320" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#05080F" flood-opacity="0.55"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#05080F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1680" height="720" fill="url(#bg)"/>
  <rect width="1680" height="720" fill="url(#dots)"/>
  <ellipse cx="900" cy="330" rx="560" ry="400" fill="url(#glow)"/>
  <ellipse cx="1290" cy="180" rx="420" ry="300" fill="url(#glowAmber)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.05" fill="none">
    <circle cx="1200" cy="360" r="250"/>
    <circle cx="1200" cy="360" r="340"/>
    <circle cx="1200" cy="360" r="430"/>
  </g>

  <!-- ligações da rede -->
  <g stroke="#4ADE80" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="10 10">
    <line x1="940" y1="350" x2="672" y2="268"/>
    <line x1="940" y1="350" x2="672" y2="438"/>
    <line x1="940" y1="350" x2="1200" y2="220"/>
    <line x1="940" y1="350" x2="1236" y2="450"/>
  </g>

  <!-- nó central -->
  <g filter="url(#soft)">
    <rect x="856" y="266" width="168" height="168" rx="34" fill="url(#glassTop)"/>
  </g>
  <rect x="884" y="298" width="112" height="14" rx="7" fill="#334155"/>
  <rect x="884" y="324" width="76" height="10" rx="5" fill="#94A3B8"/>
  <rect x="884" y="352" width="112" height="34" rx="17" fill="url(#green)"/>
  <path d="M906 369 h26 m-10 -8 l10 8 l-10 8" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="948" y="360" width="34" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- nós satélite -->
  <g filter="url(#soft2)">
    <circle cx="640" cy="250" r="58" fill="#FFFFFF"/>
  </g>
  <circle cx="640" cy="250" r="46" fill="#1E293B"/>
  <circle cx="640" cy="238" r="14" fill="#4ADE80"/>
  <path d="M616 272 a24 24 0 0 1 48 0 z" fill="#4ADE80"/>

  <g filter="url(#soft2)">
    <circle cx="640" cy="456" r="58" fill="#FFFFFF"/>
  </g>
  <circle cx="640" cy="456" r="46" fill="#1E293B"/>
  <circle cx="640" cy="444" r="14" fill="#38BDF8"/>
  <path d="M616 478 a24 24 0 0 1 48 0 z" fill="#38BDF8"/>

  <g filter="url(#soft2)">
    <circle cx="1216" cy="200" r="58" fill="#FFFFFF"/>
  </g>
  <circle cx="1216" cy="200" r="46" fill="#1E293B"/>
  <circle cx="1216" cy="188" r="14" fill="#FBB03B"/>
  <path d="M1192 222 a24 24 0 0 1 48 0 z" fill="#FBB03B"/>

  <g filter="url(#soft2)">
    <circle cx="1252" cy="470" r="58" fill="#FFFFFF"/>
  </g>
  <circle cx="1252" cy="470" r="46" fill="#1E293B"/>
  <circle cx="1252" cy="458" r="14" fill="#A78BFA"/>
  <path d="M1228 492 a24 24 0 0 1 48 0 z" fill="#A78BFA"/>

  <!-- ícone de partilha -->
  <g filter="url(#soft2)">
    <circle cx="1052" cy="520" r="52" fill="#FFFFFF"/>
  </g>
  <circle cx="1052" cy="520" r="42" fill="url(#green)"/>
  <g fill="#FFFFFF">
    <circle cx="1038" cy="506" r="6"/>
    <circle cx="1068" cy="520" r="6"/>
    <circle cx="1038" cy="534" r="6"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <line x1="1043" y1="509" x2="1063" y2="517"/>
    <line x1="1043" y1="531" x2="1063" y2="523"/>
  </g>

  <!-- distintivo de comissão -->
  <g filter="url(#soft2)">
    <rect x="1330" y="286" width="196" height="104" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="1350" y="308" width="70" height="11" rx="5.5" fill="#94A3B8"/>
  <text x="1350" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#16A34A">12%</text>
  <circle cx="1490" cy="338" r="22" fill="#DCFCE7"/>
  <path d="M1481 338 l7 7 l13 -14" stroke="#16A34A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- etiqueta de link -->
  <g filter="url(#soft2)">
    <rect x="1290" y="470" width="266" height="44" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="1316" cy="492" r="10" fill="#4ADE80"/>
  <rect x="1336" y="486" width="160" height="12" rx="6" fill="#CBD5E1"/>
  <rect x="1336" y="486" width="92" height="12" rx="6" fill="url(#green)"/>

  <rect width="1680" height="720" fill="url(#leftCalm)"/>
</svg>
