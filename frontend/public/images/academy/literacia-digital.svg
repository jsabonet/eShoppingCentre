<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-label="Mockup de literacia digital: telemóvel com passos simples, conta de email segura e ícone de lâmpada">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D2537"/>
      <stop offset="1" stop-color="#0D1320"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBB03B"/>
      <stop offset="1" stop-color="#F0801F"/>
    </linearGradient>
    <linearGradient id="glassTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#EEF2F7" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FCD34D" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FCD34D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftCalm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1320" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#0D1320" stop-opacity="0.35"/>
      <stop offset="0.62" stop-color="#0D1320" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#05080F" flood-opacity="0.55"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#05080F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1680" height="720" fill="url(#bg)"/>
  <rect width="1680" height="720" fill="url(#dots)"/>
  <ellipse cx="900" cy="320" rx="580" ry="400" fill="url(#glow)"/>
  <ellipse cx="1320" cy="520" rx="420" ry="300" fill="url(#glowBlue)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.05" fill="none">
    <circle cx="1160" cy="360" r="255"/>
    <circle cx="1160" cy="360" r="342"/>
    <circle cx="1160" cy="360" r="430"/>
  </g>
  <g stroke="#FCD34D" stroke-opacity="0.16" stroke-width="2">
    <line x1="1520" y1="30" x2="1230" y2="330"/>
    <line x1="1630" y1="140" x2="1340" y2="440"/>
    <line x1="1400" y1="700" x2="1130" y2="430"/>
  </g>

  <!-- Telemóvel com passos simples -->
  <g filter="url(#soft)">
    <rect x="580" y="146" width="312" height="474" rx="42" fill="#FFFFFF"/>
  </g>
  <rect x="596" y="162" width="280" height="442" rx="32" fill="#F6F9FC"/>
  <rect x="700" y="176" width="72" height="9" rx="4.5" fill="#DCE4EE"/>
  <rect x="644" y="200" width="184" height="16" rx="8" fill="#334155"/>
  <rect x="644" y="226" width="120" height="10" rx="5" fill="#CBD5E1"/>

  <!-- bloco de email / conta -->
  <g>
    <rect x="616" y="256" width="240" height="76" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="630" y="272" width="44" height="44" rx="12" fill="#FEF3C7"/>
    <path d="M638 286 h28 v20 h-28 z" fill="none" stroke="#F59E0B" stroke-width="3.5"/>
    <path d="M638 286 l14 11 l14 -11" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="690" y="280" width="104" height="11" rx="5.5" fill="#CBD5E1"/>
    <rect x="690" y="300" width="72" height="11" rx="5.5" fill="#E2E8F0"/>
    <circle cx="838" cy="294" r="11" fill="#DCFCE7"/>
    <path d="M833 294 l4 4 l8 -9" stroke="#16A34A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- bloco de senha -->
  <g>
    <rect x="616" y="348" width="240" height="76" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="630" y="364" width="44" height="44" rx="12" fill="#DBEAFE"/>
    <path d="M646 380 v-6 a6 6 0 0 1 12 0 v6" fill="none" stroke="#2563EB" stroke-width="3.5"/>
    <rect x="642" y="380" width="20" height="16" rx="4" fill="#2563EB"/>
    <g fill="#94A3B8">
      <circle cx="696" cy="392" r="4"/>
      <circle cx="712" cy="392" r="4"/>
      <circle cx="728" cy="392" r="4"/>
      <circle cx="744" cy="392" r="4"/>
      <circle cx="760" cy="392" r="4"/>
      <circle cx="776" cy="392" r="4"/>
    </g>
    <rect x="696" y="406" width="88" height="9" rx="4.5" fill="#E2E8F0"/>
  </g>

  <!-- bloco de internet -->
  <g>
    <rect x="616" y="440" width="240" height="76" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="630" y="456" width="44" height="44" rx="12" fill="#DCFCE7"/>
    <g stroke="#16A34A" fill="none" stroke-linecap="round">
      <path d="M640 484 a10 10 0 0 1 24 0" stroke-width="4"/>
      <path d="M644 476 a16 16 0 0 1 16 0" stroke-width="4"/>
      <circle cx="652" cy="490" r="3" fill="#16A34A" stroke="none"/>
    </g>
    <rect x="690" y="464" width="104" height="11" rx="5.5" fill="#CBD5E1"/>
    <rect x="690" y="484" width="64" height="11" rx="5.5" fill="#E2E8F0"/>
  </g>

  <rect x="616" y="536" width="240" height="46" rx="23" fill="url(#orange)"/>
  <rect x="672" y="554" width="128" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.92"/>

  <!-- Lâmpada -->
  <g filter="url(#soft2)">
    <circle cx="1006" cy="300" r="82" fill="#FFFFFF"/>
  </g>
  <circle cx="1006" cy="300" r="68" fill="url(#amber)"/>
  <path d="M1006 258 a34 34 0 0 1 20 62 c-4 3 -6 6 -6 11 h-28 c0 -5 -2 -8 -6 -11 a34 34 0 0 1 20 -62 z" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="990" y="338" width="32" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="994" y="352" width="24" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.8"/>

  <!-- Painel de progresso do curso -->
  <g filter="url(#soft)">
    <rect x="1130" y="404" width="400" height="184" rx="20" fill="url(#glassTop)"/>
  </g>
  <rect x="1158" y="432" width="150" height="13" rx="6.5" fill="#334155"/>
  <rect x="1158" y="458" width="96" height="10" rx="5" fill="#94A3B8"/>
  <rect x="1158" y="490" width="344" height="14" rx="7" fill="#E2E8F0"/>
  <rect x="1158" y="490" width="214" height="14" rx="7" fill="url(#orange)"/>
  <g>
    <rect x="1158" y="524" width="104" height="34" rx="17" fill="#FEF3C7"/>
    <rect x="1180" y="537" width="60" height="9" rx="4.5" fill="#B45309"/>
  </g>
  <g>
    <rect x="1274" y="524" width="104" height="34" rx="17" fill="#DCFCE7"/>
    <rect x="1296" y="537" width="60" height="9" rx="4.5" fill="#166534"/>
  </g>
  <g>
    <rect x="1390" y="524" width="112" height="34" rx="17" fill="#DBEAFE"/>
    <rect x="1412" y="537" width="68" height="9" rx="4.5" fill="#1D4ED8"/>
  </g>

  <!-- Etiqueta "aprender no telemóvel" -->
  <g filter="url(#soft2)">
    <rect x="518" y="150" width="196" height="44" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="546" cy="172" r="12" fill="#FBB03B"/>
  <rect x="568" y="166" width="120" height="11" rx="5.5" fill="#94A3B8"/>

  <rect width="1680" height="720" fill="url(#leftCalm)"/>
</svg>
