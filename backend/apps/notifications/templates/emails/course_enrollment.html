{% extends 'emails/base_email.html' %}
{% block preheader %}Matriculado em {{ course_title }}.{% endblock %}
{% block content %}
  <h1 style="margin:0 0 16px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:22px;color:#111827;">Matrícula confirmada 🎓</h1>
  <p style="margin:0 0 16px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:15px;line-height:22px;color:#374151;">Estás matriculado no curso <strong>{{ course_title }}</strong>. Bom estudo!</p>
  <p style="margin:0 0 24px;"><a href="{{ frontend_url }}{{ course_link }}" style="display:inline-block;background-color:#2563eb;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;">Começar a aprender →</a></p>
{% endblock %}
