{% extends 'emails/base_email.html' %}
{% block preheader %}Comissão de {{ amount }} MZN aprovada.{% endblock %}
{% block content %}
  <h1 style="margin:0 0 16px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:22px;color:#111827;">Comissão aprovada 🎉</h1>
  <p style="margin:0 0 16px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:15px;line-height:22px;color:#374151;">A tua comissão de <strong>{{ amount }} MZN</strong> foi aprovada e adicionada ao teu saldo de afiliado.</p>
  <p style="margin:0 0 24px;"><a href="{{ frontend_url }}{{ earnings_link }}" style="display:inline-block;background-color:#2563eb;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;">Ver ganhos →</a></p>
{% endblock %}
