{% extends 'emails/base_email.html' %}
{% block preheader %}{{ message }}{% endblock %}
{% block content %}
  <h1 style="margin:0 0 16px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:22px;color:#111827;">Devolução {{ rma }}</h1>
  <p style="margin:0 0 16px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:15px;line-height:22px;color:#374151;">Olá{% if first_name %}, {{ first_name }}{% endif %}, {{ message }}</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f9fafb;border:1px solid #eef0f3;border-radius:8px;margin:0 0 20px;">
    <tr><td style="padding:16px 20px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:14px;color:#374151;">
      <p style="margin:0;">Estado: <strong>{{ status_label }}</strong></p>
    </td></tr>
  </table>
  <p style="margin:0 0 24px;"><a href="{{ frontend_url }}{{ action_link }}" style="display:inline-block;background-color:#2563eb;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;">{{ action_label }} →</a></p>
{% endblock %}
